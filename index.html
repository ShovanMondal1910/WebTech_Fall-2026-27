<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <header class="login-header">
                <h2>Welcome Back</h2>
                <p>Please enter your details to sign in.</p>
            </header>

            <div class="alert alert-success" id="registerSuccess" role="status" hidden></div>

            <form action="/login-endpoint" method="POST" id="loginForm" class="login-form" novalidate>
                
                <!-- Email Input Group -->
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="e.g.,name@gmail.com" required autocomplete="email">
                    <span class="error-message" id="emailError" aria-live="polite"></span>
                </div>

                <!-- Password Input Group -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="*********" required autocomplete="current-password">
                    <span class="error-message" id="passwordError" aria-live="polite"></span>
                </div>

                <!-- Form Controls (Remember Me & Forgot Password) -->
                <div class="form-actions">
                    <label class="checkbox-label" for="rememberMe">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        Remember me
                    </label>
                    <a href="forgot-password.html" class="forgot-password-link">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">Sign In</button>

            </form>

            <!-- Registration Footer -->
            <footer class="login-footer">
                <p>Don't have an account? <a href="signup.php">Create an account</a></p>
            </footer>
        </section>
    </main>

    <script>
        // Show success message after registration (e.g. index.html?registered=1&pid=26-12345)
        const params = new URLSearchParams(window.location.search);
        if (params.get('registered') === '1') {
            const box = document.getElementById('registerSuccess');
            const pid = params.get('pid');
            box.textContent = 'Account created successfully!' + (pid ? ' Your Patient ID is ' + pid + '.' : '') + ' Please sign in.';
            box.hidden = false;
        }
    </script>
</body>
</html>
