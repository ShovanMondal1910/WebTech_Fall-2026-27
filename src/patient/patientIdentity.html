<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Patients</title>
</head>
<body>
    <header class="search-card">

        <div class="searched-items-card">
            <input type="email" placeholder="Enter registered patients email address" required>
            <button>search</button>
        </div>

        <div class="patient-data-card">
            <label for="patient-name">Name : </label>
            <label for="patient-email">Email : </label>
            <label for="patient-status">Status : </label>
        </div>

    </header>

    <main>
        <div>
            <label for="patient_id">Patient ID:</label>
            <input type="text" placeholder="Genarate ID/NID/Passport number" required>
            <button>Genarate ID</button>
            <br>
            <label for="patient_phone">Phone number:</label><br>
            <label for="address">Address: </label>
            <textarea name="address" id="address" placeholder="Enter patient address"></textarea><br>
            <label for="blood_group">Blood Group: </label>
            <option value=""></option>
        </div>
    </main>
</body>
</html>
